# Stage 1: contrastive video-text alignment.
# PGAT encoder + text encoder (mBART encoder frozen at this stage).

seed: 42

training:
  epochs: 20
  effective_batch_size: 64         # micro_batch * grad_accum
  micro_batch: 8
  grad_accum: 8
  learning_rate: 5.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.05
  scheduler: cosine
  mixed_precision: bf16
  gradient_checkpointing: true

alignment:
  loss: infonce_with_hard_negatives
  temperature: 0.07
  hard_negative_weight: 0.5
  video_embedding_dim: 768
  text_embedding_dim: 1024         # mBART encoder pooled output

early_stopping:
  metric: v2t_recall_at_1
  mode: max
  patience: 4

checkpoint:
  save_best_only: true             # NO last.pt (storage discipline)
  best_filename: alignment_best.pt
