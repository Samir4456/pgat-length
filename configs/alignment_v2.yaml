# Stage 1 alignment — tuned to fight overfitting on the 7k-sample TRAIN.
# Diff vs alignment.yaml:
#   - training.micro_batch: 8 -> 16 (effective batch 128 with grad_accum 8)
#   - training.learning_rate: 5e-5 -> 2e-5 (slower, longer)
#   - training.warmup_ratio: 0.05 -> 0.10
#   - early_stopping.patience: 4 -> 8
#   - checkpoint.best_filename: alignment_best.pt -> alignment_v2_best.pt
# Encoder dropout (in model.yaml) should be raised to 0.2 for this run.

seed: 42

training:
  epochs: 30
  effective_batch_size: 128
  micro_batch: 16
  grad_accum: 8
  learning_rate: 2.0e-5
  weight_decay: 0.02
  warmup_ratio: 0.10
  scheduler: cosine
  mixed_precision: bf16
  gradient_checkpointing: true

alignment:
  loss: infonce_with_hard_negatives
  temperature: 0.07
  hard_negative_weight: 0.5
  video_embedding_dim: 768
  text_embedding_dim: 1024

early_stopping:
  metric: v2t_recall_at_1
  mode: max
  patience: 8

checkpoint:
  save_best_only: true
  best_filename: alignment_v2_best.pt
