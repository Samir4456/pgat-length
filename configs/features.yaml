# Feature-build settings: sampling, pose extractor, storage layout.
# Used by scripts/01..04.

sampling:
  positions: 64                    # deterministic source-frame positions (FIXED)
  frames_per_token: 8              # K_temporal = clamp(round(F / 8), k_min, k_max)
  k_temporal_min: 12
  # Hard upper bound: POSITIONS / minimum_segment_width = 64 / 2 = 32.
  # DEV samples top out at F ~= 250 which yields K ~= 31, so this is not restrictive.
  k_temporal_max: 32               # must match shards.K_MAX
  minimum_segment_width: 2
  uniform_floor: 0.05
  valid_pose_fraction_threshold: 0.35
  weights:
    hands: 0.60
    body: 0.25
    mouth: 0.15

storage:
  shard_size: 192                  # samples per plan/spatial/motion shard
  atomic_suffix: .partial

pose:
  # MediaPipe .task files. Transfer these once from your laptop to
  # $HOME/pgat-length/assets/mediapipe/ or set absolute paths.
  hand_model: assets/mediapipe/hand_landmarker.task
  face_model: assets/mediapipe/face_landmarker.task
  body_model: assets/mediapipe/pose_landmarker_lite.task
  min_hand_detection_confidence: 0.30
  min_hand_presence_confidence: 0.30
  min_face_detection_confidence: 0.30
  min_face_presence_confidence: 0.30
  min_pose_detection_confidence: 0.30
  min_pose_presence_confidence: 0.30
  smoothing_window: 3

spatial:
  model_name: facebook/dinov2-base
  feature_dim: 768
  views: 4                         # global + left hand + right hand + mouth
  dtype: float16

motion:
  # 8 fixed motion clips per sample (independent of K_temporal).
  # TimeSformer produces one pooled 768-D embedding per clip.
  model_name: facebook/timesformer-base-finetuned-k400
  feature_dim: 768
  clips: 8
  frames_per_clip: 8
  clip_span: 15
  dtype: float16

text:
  # mBART tokenizer cache for target German references.
  # Independent of the visual banks. Runs on CPU; tiny output (~5 MB total).
  model_name: facebook/mbart-large-cc25
  src_lang: de_DE
  tgt_lang: de_DE
  max_target_tokens: 96            # matches translation.yaml.training.max_target_tokens

text_qwen:
  # Qwen tokenizer cache for the QLoRA decoder path (scripts/13, 15, 16).
  # Standalone npz (not integrated with the mBART shard machinery).
  model_name: Qwen/Qwen2.5-3B-Instruct
  max_prompt_tokens: 96            # instruction turn (chat template)
  max_target_tokens: 96            # matches translation_qwen.yaml

text_mpnet:
  # MPNet sentence-embedding cache for the alignment path (scripts/17, alignment_mpnet.yaml).
  # One 768-D vector per sample; stored as a single npz per split.
  model_name: sentence-transformers/all-mpnet-base-v2
  embedding_dim: 768
  normalize: false                 # alignment model L2-normalizes after its own projection
