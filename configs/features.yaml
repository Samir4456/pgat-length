# Feature-build settings: sampling, pose extractor, storage layout.
# Used by scripts/01..04.

sampling:
  positions: 64                    # deterministic source-frame positions (FIXED)
  frames_per_token: 8              # K_temporal = clamp(round(F / 8), k_min, k_max)
  k_temporal_min: 12
  k_temporal_max: 40               # must match shards.K_MAX
  minimum_segment_width: 2
  uniform_floor: 0.05
  valid_pose_fraction_threshold: 0.35
  weights:
    hands: 0.60
    body: 0.25
    mouth: 0.15

storage:
  shard_size: 192                  # samples per plan/spatial/motion shard
  atomic_suffix: .partial

pose:
  # MediaPipe .task files. Transfer these once from your laptop to
  # $HOME/pgat-length/assets/mediapipe/ or set absolute paths.
  hand_model: assets/mediapipe/hand_landmarker.task
  face_model: assets/mediapipe/face_landmarker.task
  body_model: assets/mediapipe/pose_landmarker_lite.task
  min_hand_detection_confidence: 0.30
  min_hand_presence_confidence: 0.30
  min_face_detection_confidence: 0.30
  min_face_presence_confidence: 0.30
  min_pose_detection_confidence: 0.30
  min_pose_presence_confidence: 0.30
  smoothing_window: 3

spatial:
  model_name: facebook/dinov2-base
  feature_dim: 768
  views: 4                         # global + left hand + right hand + mouth
  dtype: float16
