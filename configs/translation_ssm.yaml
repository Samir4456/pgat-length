# Stage 2 translation with the bidirectional SSM adapter enabled.
# Diff vs translation_v2.yaml:
#   - checkpoint.best_filename: translation_ssm_best.pt
# Everything else matches v2 so the only variable between runs is the
# presence of the SSM adapter (from model_ssm.yaml vs model_v2.yaml).

seed: 42

training:
  epochs: 25
  effective_batch_size: 24
  micro_batch: 3
  grad_accum: 8
  learning_rate: 2.0e-5
  encoder_learning_rate: 2.0e-5
  decoder_learning_rate: 2.0e-5
  pgat_learning_rate: 8.0e-5
  dinov2_learning_rate: 1.0e-5
  weight_decay: 0.03
  warmup_ratio: 0.10
  scheduler: cosine
  max_target_tokens: 96
  label_smoothing: 0.15
  mixed_precision: bf16
  gradient_checkpointing: true

generation:
  max_new_tokens: 96
  num_beams: 3
  no_repeat_ngram_size: 3
  length_penalty: 1.0
  early_stopping: true

warm_start:
  # Reuses the v2 alignment checkpoint since the visual encoder + articulator
  # + global summary shapes are unchanged; SSM adapter is randomly initialized
  # and warm-starts only from itself (no matching name in the alignment ckpt).
  alignment_checkpoint: ${HOME}/outputs/alignment/alignment_v2_best.pt
  strict: true

early_stopping:
  metric: dev_loss
  mode: min
  patience: 6

checkpoint:
  save_best_only: true
  best_filename: translation_ssm_best.pt
  save_base_weights: false
