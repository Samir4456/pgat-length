[project]
name = "pgat-length"
version = "0.1.0"
description = "Pose-guided variable-length prefix + mBART for gloss-free SLT on PHOENIX14T"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Samir Pokharel" }]

dependencies = [
    "torch>=2.2",
    "transformers>=4.42",
    "sentencepiece>=0.2",
    "accelerate>=0.30",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyyaml>=6.0",
    "safetensors>=0.4",
    "sacrebleu>=2.4",
    "rouge-score>=0.1.2",
    "tqdm>=4.66",
    "einops>=0.7",
    "mediapipe>=0.10",
    "opencv-python-headless>=4.9",
    "pillow>=10.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
